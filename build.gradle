pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

plugins {
    id 'java'
    id 'io.github.liplum.mgpp' version '1.3.0'
}

version = '1.0'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

mindustry {
    dependency {
        mindustry version: 'v159'
        arc version: 'v159'
    }
}

sourceSets {
    main {
        resources {
            srcDirs = []
        }
    }
}

jar {
    archiveFileName = 'tianyou-shield.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('mod.hjson')
    from('assets') {
        into 'assets'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
